<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>AI Werewolf</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">狼</div>
        <div>
          <h1>AI Werewolf</h1>
          <p>多智能体狼人杀观战台</p>
        </div>
      </div>
      <div class="top-actions">
        <span id="connectionStatus" class="status-dot idle">连接中</span>
        <span class="session-line">Session <code id="sessionIdText">-</code></span>
        <button id="copySessionButton" class="button secondary" type="button">复制链接</button>
        <button id="refreshButton" class="button secondary" type="button">刷新</button>
      </div>
    </header>

    <section class="card launch-card">
      <form id="createForm" class="launch-form">
        <label>板子
          <select name="preset">
            <option value="6p" selected>6p</option>
            <option value="8p-simple">8p-simple</option>
            <option value="10p-standard">10p-standard</option>
          </select>
        </label>
        <label>模式
          <select name="agent_mode" id="agentModeInput">
            <option value="rule">rule</option>
            <option value="llm">llm</option>
          </select>
        </label>
        <label>Seed
          <input name="seed" type="number" value="42" />
        </label>
        <label>人类席位
          <input name="human" placeholder="纯 AI 留空；如 P1" />
        </label>
        <label>输出目录
          <input name="out" value="logs/web" />
        </label>
        <button class="button" type="submit">开始新局</button>

        <details class="advanced">
          <summary>高级配置</summary>
          <div class="advanced-grid">
            <label>自定义角色
              <input name="roles" placeholder="werewolf,werewolf,seer,witch,villager,villager" />
            </label>
            <label>事件延迟
              <input name="event_delay" type="number" step="0.1" min="0" value="0.25" />
            </label>
            <label>LLM 配置文件
              <input name="llm_agent_config" placeholder="llm_agents.local.json" />
            </label>
            <label>LLM Profile
              <input name="llm_agent_profile" placeholder="fast / strong / local" />
            </label>
            <label>Base URL
              <input name="llm_base_url" placeholder="https://api.openai.com/v1" />
            </label>
            <label>Model
              <input name="llm_model" placeholder="gpt-4o-mini" />
            </label>
            <label>API Key
              <input name="llm_api_key" type="password" autocomplete="off" placeholder="推荐使用 .env" />
            </label>
            <label>Temperature
              <input name="llm_temperature" type="number" min="0" max="2" step="0.1" placeholder="0.2" />
            </label>
            <label>Max Tokens
              <input name="llm_max_tokens" type="number" min="1" placeholder="700" />
            </label>
            <label>Timeout
              <input name="llm_timeout" type="number" min="1" step="1" placeholder="60" />
            </label>
            <label>最大天数
              <input name="max_days" type="number" value="10" min="1" />
            </label>
            <label>平票策略
              <select name="tie_policy">
                <option value="no_exile">no_exile</option>
                <option value="random">random</option>
              </select>
            </label>
            <label class="check-row"><input type="checkbox" name="llm_json_mode" /> JSON mode</label>
            <label class="check-row"><input type="checkbox" name="no_llm_rule_fallback" /> 禁用 LLM fallback</label>
            <label class="check-row"><input type="checkbox" name="reveal_death_role" /> 死亡公开身份</label>
          </div>
        </details>
      </form>
      <div class="session-tools">
        <label>切换 Session
          <select id="sessionPicker"></select>
        </label>
        <label class="check-row god-row"><input type="checkbox" id="godToggle" /> 上帝视角</label>
        <span id="serverMeta" class="muted">读取服务信息...</span>
        <span id="createStatus" class="muted"></span>
      </div>
    </section>

    <main class="game-grid">
      <section class="card stage-card">
        <div class="section-head">
          <div>
            <p class="eyebrow">Current Game</p>
            <h2 id="heroTitle">等待对局启动</h2>
            <p id="heroSubtitle" class="muted">正在连接本地后端...</p>
          </div>
          <div id="winnerCard" class="winner hidden"></div>
        </div>
        <div id="statusChips" class="chips"></div>
        <div id="players" class="players"></div>
      </section>

      <section class="card timeline-card">
        <div class="section-head compact-head">
          <div>
            <p class="eyebrow">Public Timeline</p>
            <h2>公开事件</h2>
          </div>
          <div class="timeline-tools">
            <input id="eventSearch" type="search" placeholder="搜索事件" />
            <select id="eventFilter">
              <option value="all">全部</option>
              <option value="speech">发言</option>
              <option value="vote">投票</option>
              <option value="system">系统</option>
            </select>
          </div>
        </div>
        <div id="events" class="timeline"></div>
      </section>

      <aside class="side-column">
        <section class="card">
          <div class="section-head compact-head">
            <div>
              <p class="eyebrow">Human Action</p>
              <h2>人类行动</h2>
            </div>
            <span id="pendingBadge" class="pill">等待</span>
          </div>
          <label>人类席位
            <select id="humanSelect"></select>
          </label>
          <div id="pending" class="pending">请选择人类玩家席位。</div>
        </section>

        <details class="card collapsible" open>
          <summary>输出文件</summary>
          <div id="artifacts" class="artifact-list"></div>
        </details>

        <details class="card collapsible">
          <summary>LLM 配置概览</summary>
          <div id="llmConfigs" class="config-list"></div>
        </details>
      </aside>
    </main>
  </div>

  <script src="/static/app.js" defer></script>
</body>
</html>
