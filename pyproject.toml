[project]
name = "ai-werewolf-mvp"
version = "2.2.0"
description = "Runnable multi-agent AI Werewolf system with independent LLM agents, evaluation, replay, and separated web UI"
requires-python = ">=3.10"
authors = [{ name = "AI Werewolf Agent Team" }]
readme = "README.md"
dependencies = [
  "pytest>=9.0.3",
  "python-dotenv>=1.2.2",
]

[project.scripts]
ai-werewolf = "ai_werewolf.cli:main"

[tool.setuptools.packages.find]
include = ["ai_werewolf*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
