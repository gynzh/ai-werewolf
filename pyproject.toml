[project]
name = "ai-werewolf-mvp"
version = "2.3.0"
description = "Runnable multi-agent AI Werewolf system with session-based web UI, independent LLM agents, evaluation, and replay"
requires-python = ">=3.10"
authors = [{ name = "AI Werewolf Agent Team" }]
readme = "README.md"
dependencies = [
  "python-dotenv>=1.2.2",
]

[project.scripts]
ai-werewolf = "ai_werewolf.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
